# Staging is selected explicitly with SPRING_PROFILES_ACTIVE=staging.
server.port=10000

# Same-origin public URL used for CORS, WebSockets, and password-reset links.
app.frontend-base-url=${FRONTEND_BASE_URL}
projectum.frontend-url=${FRONTEND_BASE_URL}
app.cors.allowed-origins=${FRONTEND_BASE_URL}

# The Compose network resolves the staging-only database as "db".
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/projectum_staging}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:projectum_staging}

# This repository does not yet contain a valid Flyway bootstrap chain: it starts
# at V12 and currently contains duplicate V21 migrations. Keep Flyway disabled
# until that chain is repaired and validated against an empty PostgreSQL database.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=update

# No customer data or external side effects in staging by default. The legacy
# generic seeder is never used here; the staging seeder has a separate gate.
app.seed.enabled=false
app.staging-seed.enabled=${APP_STAGING_SEED_ENABLED:false}
app.bootstrap-owner.enabled=false
app.mail.delivery-enabled=false
projectum.ai.enabled=false
management.health.mail.enabled=false

# Dedicated persistent staging paths (mounted by Compose).
ticketing.storage.path=/app/uploads/tickets
crm.storage.path=/app/uploads/crm

# Keep shared-VPS logs bounded and avoid SQL/secret noise.
logging.file.name=/app/logs/projectum-staging.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=5
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
