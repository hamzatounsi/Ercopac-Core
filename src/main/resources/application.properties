spring.application.name=ercopac-tracker

server.port=${PORT:8087}
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:4200}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ercopac_db}
spring.datasource.username=postgres
spring.datasource.password=1234
app.seed.enabled=true
spring.jpa.properties.hibernate.default_schema=public
spring.datasource.hikari.schema=public

# Preserve existing PostgreSQL data across restarts.  The development profile
# also uses `update`; destructive schema creation must be an explicit action.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

jwt.secret=${JWT_SECRET:change-this-local-dev-secret-32-bytes-minimum}
auth.login.max-failed-attempts=${AUTH_LOGIN_MAX_FAILED_ATTEMPTS:5}
auth.login.lock-minutes=${AUTH_LOGIN_LOCK_MINUTES:15}

# Email alerts


spring.flyway.enabled=true
spring.flyway.locations=classpath:migration
projectum.frontend-url=http://localhost:4200
# Outgoing e-mail (IONOS). Credentials come only from the environment: MAIL_HOST, MAIL_PORT,
# MAIL_USERNAME, MAIL_PASSWORD, MAIL_FROM. Locally they are read from an untracked .env file
# (see .env.example); in Docker/production they are passed to the container as env vars.
spring.config.import=optional:file:.env[.properties]
spring.mail.host=${MAIL_HOST:smtp.ionos.it}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Every e-mail is sent from this address (IONOS only accepts the authenticated mailbox as sender)
app.mail.from=${MAIL_FROM:info@projectumall.com}
app.mail.from-name=${MAIL_FROM_NAME:Projectum}
# An SMTP outage must not mark the app DOWN (the production deploy rolls back on an unhealthy /actuator/health)
management.health.mail.enabled=${MAIL_HEALTH_ENABLED:false}
# AI features

projectum.ai.enabled=true
projectum.ai.model=qwen2.5:7b
projectum.ai.url=http://localhost:11434/api/generate
projectum.ai.max-tokens=300
# Streaming AI answers run as async requests; Tomcat's default 30s async timeout cuts slow local models mid-answer
spring.mvc.async.request-timeout=180s


management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false
# Ticket attachments: videos up to 20 MB (enforced per type in TicketAttachmentService)
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:25MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:30MB}
