spring.application.name=ercopac-tracker

server.port=${PORT:8087}
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:4200}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ercopac_db}
spring.datasource.username=postgres
spring.datasource.password=11991330
app.seed.enabled=true
spring.jpa.properties.hibernate.default_schema=public
spring.datasource.hikari.schema=public

# Preserve existing PostgreSQL data across restarts.  The development profile
# also uses `update`; destructive schema creation must be an explicit action.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

jwt.secret=${JWT_SECRET:change-this-local-dev-secret-32-bytes-minimum}
auth.login.max-failed-attempts=${AUTH_LOGIN_MAX_FAILED_ATTEMPTS:5}
auth.login.lock-minutes=${AUTH_LOGIN_LOCK_MINUTES:15}

# Email alerts

spring.mail.host=${PROJECTUM_MAIL_HOST:smtp.ionos.com}
spring.mail.port=${PROJECTUM_MAIL_PORT:587}
spring.mail.username=${PROJECTUM_MAIL_USERNAME:}
spring.mail.password=${PROJECTUM_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
projectum.frontend-url=${PROJECTUM_FRONTEND_URL:${app.frontend-base-url}}


# AI features

projectum.ai.enabled=true
projectum.ai.model=qwen2.5:7b
projectum.ai.url=http://localhost:11434/api/generate
