
name: Release Projectum to Production

on:
  workflow_dispatch:
    inputs:
      backend_sha:
        description: "Validated backend staging commit (full SHA)"
        required: true
        type: string
      frontend_sha:
        description: "Validated frontend staging commit (full SHA)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: projectum-production-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release versions (no deployment)
    runs-on: ubuntu-latest
    steps:
      - name: Verify SHA formats
        env:
          BACKEND_SHA: ${{ inputs.backend_sha }}
          FRONTEND_SHA: ${{ inputs.frontend_sha }}
        run: |
          [[ "$BACKEND_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || exit 1
          [[ "$FRONTEND_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || exit 1

      - name: Verify backend commit is on staging
        env:
          RELEASE_SHA: ${{ inputs.backend_sha }}
        run: |
          git clone --quiet --branch staging \
            https://github.com/hamzatounsi/Ercopac-Core.git backend
          cd backend
          git merge-base --is-ancestor "$RELEASE_SHA" origin/staging

      - name: Verify frontend commit is on staging
        env:
          RELEASE_SHA: ${{ inputs.frontend_sha }}
        run: |
          git clone --quiet --branch staging \
            https://github.com/hamzatounsi/Ercopac-UI.git frontend
          cd frontend
          git merge-base --is-ancestor "$RELEASE_SHA" origin/staging

      - name: Dry-run complete
        run: |
          echo "Release versions verified."
          echo "No production changes were made."
