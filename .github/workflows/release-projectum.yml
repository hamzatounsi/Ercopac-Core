name: Release Projectum to Production

on:
  workflow_dispatch:
    inputs:
      backend_sha:
        description: 'Validated backend staging commit (40-character SHA)'
        required: true
        type: string
      frontend_sha:
        description: 'Validated frontend staging commit (40-character SHA)'
        required: true
        type: string
      dry_run:
        description: 'Check commits and server prerequisites only (no production changes)'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: projectum-production-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify selected staging commits
    runs-on: ubuntu-latest
    outputs:
      backend_sha: ${{ steps.validate.outputs.backend_sha }}
      frontend_sha: ${{ steps.validate.outputs.frontend_sha }}
    steps:
      - name: Validate SHA format
        id: validate
        shell: bash
        env:
          BACKEND_SHA: ${{ inputs.backend_sha }}
          FRONTEND_SHA: ${{ inputs.frontend_sha }}
        run: |
          set -euo pipefail
          [[ "$BACKEND_SHA" =~ ^[a-fA-F0-9]{40}$ ]] || { echo 'Invalid backend SHA'; exit 1; }
          [[ "$FRONTEND_SHA" =~ ^[a-fA-F0-9]{40}$ ]] || { echo 'Invalid frontend SHA'; exit 1; }
          echo "backend_sha=${BACKEND_SHA,,}" >> "$GITHUB_OUTPUT"
          echo "frontend_sha=${FRONTEND_SHA,,}" >> "$GITHUB_OUTPUT"

      - name: Check commits exist in staging branches
        shell: bash
        env:
          BACKEND_SHA: ${{ steps.validate.outputs.backend_sha }}
          FRONTEND_SHA: ${{ steps.validate.outputs.frontend_sha }}
        run: |
          set -euo pipefail
          git clone -q --branch staging https://github.com/hamzatounsi/Ercopac-Core.git backend
          git -C backend merge-base --is-ancestor "$BACKEND_SHA" origin/staging
          git clone -q --branch staging https://github.com/hamzatounsi/Ercopac-UI.git frontend
          git -C frontend merge-base --is-ancestor "$FRONTEND_SHA" origin/staging
          echo "Verified staging commits: backend=$BACKEND_SHA frontend=$FRONTEND_SHA"

  release:
    name: ${{ inputs.dry_run && 'Production dry run' || 'Deploy Projectum to production' }}
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    steps:
      - name: Validate production VPS and deploy approved commits
        uses: appleboy/ssh-action@v1.2.0
        env:
          BACKEND_SHA: ${{ needs.verify.outputs.backend_sha }}
          FRONTEND_SHA: ${{ needs.verify.outputs.frontend_sha }}
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 80m
          script_stop: true
          envs: BACKEND_SHA,FRONTEND_SHA,DRY_RUN
          script: |
            set -Eeuo pipefail
            cd /opt/projectum
            command -v docker >/dev/null
            command -v git >/dev/null
            docker compose ps --status running --services | grep -qx 'projectum-db'
            test -d backend/.git && test -d frontend/.git
            test -z "$(git -C backend status --porcelain)" || { echo 'Backend checkout has uncommitted changes'; exit 1; }
            test -z "$(git -C frontend status --porcelain)" || { echo 'Frontend checkout has uncommitted changes'; exit 1; }

            BACKEND_PREV=$(git -C backend rev-parse HEAD)
            FRONTEND_PREV=$(git -C frontend rev-parse HEAD)
            echo "Current production: backend=$BACKEND_PREV frontend=$FRONTEND_PREV"
            echo "Requested release: backend=$BACKEND_SHA frontend=$FRONTEND_SHA"
