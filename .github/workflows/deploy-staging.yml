
name: Build and Deploy Backend to Staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: projectum-staging-backend
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Compile and run tests
        run: ./mvnw clean verify

      - name: Verify staging Flyway configuration
        run: |
          grep -Fxq 'spring.flyway.enabled=false' \
            src/main/resources/application-staging.properties

      - name: Verify staging Docker image builds
        run: docker build -t projectum-staging-backend:${{ github.sha }} .

  deploy:
    name: Deploy Backend to Staging
    needs: verify
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Configure secure SSH access
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          umask 077
          mkdir -p "$HOME/.ssh"

          printf '%s\n' "$STAGING_SSH_KEY" > "$HOME/.ssh/staging_key"
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/staging_key"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy only the staging backend
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          DEPLOYMENT_ID: ${{ github.sha }}
        run: |
          set -euo pipefail

          ssh -T \
            -i "$HOME/.ssh/staging_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -p "${STAGING_SSH_PORT:-22}" \
            "${STAGING_USER}@${STAGING_HOST}" \
            "staging-deploy backend ${DEPLOYMENT_ID}"

      - name: Clean up SSH private key
        if: always()
        run: |
          rm -f "$HOME/.ssh/staging_key"
