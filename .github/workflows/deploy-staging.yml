name: Build and Deploy Backend to Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: projectum-staging-backend
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: chmod +x mvnw
      - name: Compile and test
        run: ./mvnw clean verify
      - name: Reject accidentally enabled Flyway staging startup
        run: grep -Fxq 'spring.flyway.enabled=false' src/main/resources/application-staging.properties
      - name: Build staging image locally
        run: docker build -t projectum-staging-backend:${{ github.sha }} .

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy only the staging backend
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOYMENT_ID: ${{ github.sha }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || '22' }}
          timeout: 30s
          command_timeout: 30m
          script_stop: true
          envs: DEPLOYMENT_ID
          script: |
            BACKEND_DEPLOYMENT_ID="$DEPLOYMENT_ID" bash \
              /opt/projectum-staging/backend/deploy/staging/scripts/deploy-service.sh \
              backend '${{ github.sha }}'
