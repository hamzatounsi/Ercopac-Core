name: Deploy Backend to Production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy backend on production server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e

            echo "=== Move to Projectum ==="
            cd /opt/projectum

            echo "=== Backup database ==="
            mkdir -p backups
            docker compose exec -T projectum-db \
              pg_dump \
              -U projectum_user \
              -d projectum_db \
              > "backups/projectum_$(date +%Y%m%d_%H%M%S).sql"

            echo "=== Update backend source ==="
            cd /opt/projectum/backend
            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            echo "=== Rebuild backend ==="
            cd /opt/projectum
            docker compose build projectum-backend

            echo "=== Recreate backend container ==="
            docker compose up -d --no-deps projectum-backend

                        echo "=== Backend health check ==="

            for i in {1..12}; do
              if docker compose exec -T projectum-backend \
                  wget -qO- http://localhost:10000/actuator/health \
                  | grep -q '"status":"UP"'; then

                echo "Backend is healthy."
                exit 0
              fi

              echo "Waiting for backend... attempt $i/12"
              sleep 5
            done

            echo "Backend failed health check."
            docker compose logs --tail=100 projectum-backend
            exit 1

            echo "=== Backend status ==="
            docker compose ps projectum-backend

            echo "=== Recent backend logs ==="
            docker compose logs --tail=80 projectum-backend
